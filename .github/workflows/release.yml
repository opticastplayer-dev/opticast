name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 2.6.60)'
        required: true
        default: '2.6.60'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore signing key
        run: |
          mkdir -p signing
          echo "${{ secrets.SIGNING_JKS_BASE64 }}" | base64 -d > signing/opticast-release.jks
          echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" > signing/signing.properties
          echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> signing/signing.properties
          echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> signing/signing.properties

      - name: Build native runtime
        run: |
          cd project/native
          bash build-native.sh || echo "Native build skipped - using prebuilt"
          bash package-runtime.sh || true

      - name: Build APK
        run: |
          cd project
          ./gradlew assembleOfficialRelease --stacktrace --no-daemon || gradle assembleOfficialRelease --stacktrace --no-daemon

      - name: Package release
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          VERSION=${VERSION#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p releases
          APK=$(find project/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -f "$APK" ]; then
            cp "$APK" "releases/OptiCast-v${VERSION}.apk"
            cp "$APK" "OptiCast-v${VERSION}.apk"
            sha256sum "releases/OptiCast-v${VERSION}.apk" > "releases/SHA256SUMS-v${VERSION}.txt"
          fi
          # Complete source
          git archive --format=zip -o "releases/OptiCast-v${VERSION}-complete-source.zip" HEAD
          zip -r "OptiCast-v${VERSION}-complete-source.zip" project/native/prebuilt 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/*.apk
            releases/*.zip
            releases/*.txt
            OptiCast-*.apk
            OptiCast-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OptiCast-APK
          path: |
            releases/*.apk
            OptiCast-*.apk
