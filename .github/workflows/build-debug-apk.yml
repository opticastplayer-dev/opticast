name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'project/**'
      - '.github/workflows/build-debug-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-36" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./project/gradlew

      - name: Build Debug APK
        working-directory: ./project
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptiCast-debug-APK-v2.6.121-all14
          path: project/app/build/outputs/apk/debug/*.apk
          retention-days: 30
