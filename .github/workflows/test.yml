name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-36" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./project/gradlew

      - name: Run unit tests (all)
        working-directory: ./project
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            project/app/build/reports/tests/
            project/app/build/test-results/

      - name: Upload test summary
        if: always()
        run: |
          echo "=== Test Results ==="
          find project/app/build/test-results -name "*.xml" -exec cat {} \; 2>/dev/null | head -n 100 || echo "No XML results"
          ls -lh project/app/build/reports/tests/ 2>/dev/null || echo "No reports dir"
