name: Unit Tests
on: [push/PR to main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - Checkout v4
      - JDK 17 temurin cache gradle
      - Setup Gradle v3  # better cache, same as release.yml
      - chmod +x gradlew
      - Run ALL tests: ./gradlew :app:testDebugUnitTest --stacktrace
        (9 files, 25+ tests: util, local, parser + InstallOver, LibraryRepo, Poster)
      - Upload reports + test-results
      - Summary step cat XML
