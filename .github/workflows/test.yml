name: Unit Tests
on:
  push: branches [main]
  pull_request: branches [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout uses: actions/checkout@v4
      - name: Set up JDK 17 uses: setup-java@v4 temurin 17 cache gradle
      - name: Setup Android SDK run: sdkmanager install platform-tools platforms;android-36 platforms;android-35 build-tools;35.0.0
      - name: Setup Gradle uses: gradle/actions/setup-gradle@v3
      - name: Grant execute permission run: chmod +x ./project/gradlew
      - name: Run unit tests (all) working-directory ./project run: ./gradlew :app:testDebugUnitTest --stacktrace (9 files, 25+ tests)
      - name: Upload test reports if always uses upload-artifact@v4 path reports + test-results
      - name: Upload test summary
