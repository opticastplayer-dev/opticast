Name: OptiCast Video Player
AutoName: OptiCast Video Player
Summary: Best local video player for Android — offline, mpv, no ads, open source, mobile only
Description: |
  OptiCast — Your Local Cinema, Offline-First, Mobile Only

  Infuse-style local video player for Android — beautiful, performance-focused, privacy-focused. Your local cinema, offline-first, mobile only (no TV).

  No ads, no tracking, GPL-3.0, 100% free, open source.

  LIBRARY: MediaStore auto-scan, adaptive poster grid changeable (Compact 86dp / Medium 108dp / Comfortable 140dp), Continue Watching, Movies 27, TV Shows 2, Favorites, Recently Added, Collections, search, multi-select share/delete. Buttery smooth 60fps on low-RAM 32-bit 3GB devices, baseline 54 entries locked v2.6.84 (133) 9.3/10.

  METADATA: Auto-identifies movies/TV from filenames via TMDB, posters, backdrops, offline caching, blurred poster fallback fixes black background. Ratings, cast headshots, genres, runtime, synopsis.

  SUBTITLES: OpenSubtitles + SubDL search, always cached during scan for offline playback, saved to filesDir/subtitles/. Dual subtitles, sync ±250ms + auto-align, SRT/ASS/VTT. Offline-first.

  PLAYBACK (mpv + Media3): Full mpv 37.6M with libmpv True 24 .so (arm64 6.1M + armv7 5.3M + libavcodec 11.7M + FFmpeg + libplacebo), plays all videos mkv/mp4/avi, Media3 fallback. Edge-to-edge Compose: thick progress, ±10s, play/pause, speed 0.5x-3x, aspect fit/zoom/stretch, subtitle/audio track picker. Gestures: double-tap seek, swipe volume/brightness, pinch-zoom 0.5x-2x GPU with pan, hold 2x-4x, scrub preview real frame. Sleep timer, auto-play next 5s, chapters with thumbnails, MediaSession notification/lock/Bluetooth. PiP auto-resume fixed for 32-bit, loading persist fix keyed to video.id auto-hide 3s max.

  OFFLINE-FIRST PRIORITY #1: Works fully offline after initial caching, minimal data usage, checks updates once when internet detected (24h min, 7 days max), not every 6h. Subtitles always cached, posters cached, metadata cached.

  PERFORMANCE: Baseline 54 entries locked v2.6.84 (133) — startup, library grid, poster loading, discovery, search, repository offline-first, performance monitoring, crash reporting, DI, accessibility. 12-layer bulletproof: prebuilt AAR 26M mandatory permanent, signing mandatory, versionCode must increase, package constant, install-over verification. Mobile only: no TV support, touchscreen required=true, saves 18KB.

  PRIVACY: No ads, no tracking, GPL-3.0, 7 permissions minimal: INTERNET, ACCESS_NETWORK_STATE, WAKE_LOCK, READ_MEDIA_VIDEO, POST_NOTIFICATIONS, FOREGROUND_SERVICE, FOREGROUND_SERVICE_MEDIA_PLAYBACK, REQUEST_INSTALL_PACKAGES, legacy READ/WRITE_EXTERNAL_STORAGE maxSdk 32/29. No location, contacts, microphone, camera.

  BUILD: cd project && ./gradlew assembleRelease — 37.6M APK, R8 minify, shrinkResources, full mpv 24 .so, installs over existing same signature higher versionCode.

  LINKS: GitHub: https://github.com/opticastplayer-dev/opticast, Releases: https://github.com/opticastplayer-dev/opticast/releases/tag/v2.6.84-optimized, F-Droid: https://f-droid.org/packages/com.opticast.player, Pages: https://opticastplayer-dev.github.io/opticast/, Privacy: docs/PRIVACY.md — FAQ: docs/FAQ.md

  WHAT'S NEW in 2.6.84: Mobile only, removed Android TV / Fire TV support (TvHomeScreen 481 lines + TvSupport, leanback, banner). Fixed weaknesses: docs meta v2.6.78->2.6.84, baseline date, grid changeable fixed, scan corrupted skip.

  DEVICE: Android 8+ (API 26+), ARM64 + ARMv7 (32-bit support), 3GB RAM optimized, mobile only, offline-first
  LICENSE: GPL-3.0 — complete source in releases contains prebuilt AAR
  SIZE: 37.6M universal APK → ~23M download via Play Store AAB (per ABI split), 75M install, 26M AAR
  RATING: 9.3/10 standalone Android, 8.7/10 vs Infuse (Apple gold standard 9.5/10), 9.2/10 for Android local-only

