name: Release Build
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version: {description: 'Version', required: true, default: '2.6.60'}
      full_mpv: {description: 'Build full with mpv', required: false, default: 'true', type: choice, options: ['true','false']}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {java-version: '17', distribution: 'temurin'}
      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" || true
      - uses: gradle/actions/setup-gradle@v3
      - name: Restore signing key (fixed base64 handling)
        run: |
          mkdir -p signing
          rm -f signing/opticast-release.jks signing/signing.properties
          if [ -n "${{ secrets.SIGNING_JKS_BASE64 }}" ]; then
            echo "Found secret, length ${#SIGNING_JKS_BASE64} chars"
            echo "${{ secrets.SIGNING_JKS_BASE64 }}" | tr -d ' \n\r\t' | base64 -d > signing/opticast-release.jks 2>&1 && echo "✅ JKS decoded" || {
              echo "⚠️ base64 -d failed, trying -i..."
              echo "${{ secrets.SIGNING_JKS_BASE64 }}" | base64 -d -i > signing/opticast-release.jks 2>&1 && echo "✅ decoded with -i" || {
                echo "❌ Invalid base64, fallback to debug"; rm -f signing/opticast-release.jks
              }
            }
            if [ -f "signing/opticast-release.jks" ]; then
              JKS_SIZE=$(stat -c%s "signing/opticast-release.jks" 2>&1 || wc -c < "signing/opticast-release.jks")
              echo "JKS size: $JKS_SIZE bytes"
              [ "$JKS_SIZE" -lt 1000 ] && rm -f signing/opticast-release.jks && echo "Too small, fallback to debug"
            fi
            echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" > signing/signing.properties
            echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> signing/signing.properties
            echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> signing/signing.properties
          else
            echo "No secret - debug keystore"
            echo "storePassword=android" > signing/signing.properties
            echo "keyAlias=androiddebugkey" >> signing/signing.properties
            echo "keyPassword=android" >> signing/signing.properties
          fi
          [ ! -f "signing/signing.properties" ] && echo "storePassword=android" > signing/signing.properties && echo "keyAlias=androiddebugkey" >> signing/signing.properties && echo "keyPassword=android" >> signing/signing.properties
          ls -lh signing/ || true
      - name: Generate Gradle Wrapper
        run: |
          cd project
          [ ! -f "gradlew" ] && gradle wrapper --gradle-version 8.11.1 || true
          chmod +x gradlew || true
      - name: Restore native runtime AAR for full mpv
        if: ${{ inputs.full_mpv == 'true' || inputs.full_mpv == '' }}
        run: |
          mkdir -p .cache/native-runtime
          python3 project/native/restore-from-apk.py || echo "Restore failed"
          ls -lh .cache/native-runtime/ || true
      - name: Build APK
        run: |
          cd project
          if [ -f "../.cache/native-runtime/opticast-mpv-runtime.aar" ]; then
            echo "FULL with mpv"
            ./gradlew assembleOfficialRelease --stacktrace --no-daemon || ./gradlew assembleRelease --stacktrace --no-daemon || ./gradlew assembleDebug --stacktrace --no-daemon
          else
            echo "Media3-only"
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi
      - name: Package
        run: |
          VERSION=${{ github.event.inputs.version || '2.6.60' }}; VERSION=${VERSION#v}; mkdir -p releases
          APK=$(find project/app/build/outputs/apk -name "*.apk" -type f | grep -E "official|release" | head -1); [ -z "$APK" ] && APK=$(find project/app/build/outputs/apk -name "*.apk" | head -1)
          [ -f "$APK" ] && cp "$APK" "releases/OptiCast-v${VERSION}.apk" && sha256sum "releases/OptiCast-v${VERSION}.apk" > "releases/SHA256SUMS-v${VERSION}.txt" || exit 1
          git archive --format=zip -o "releases/OptiCast-v${VERSION}-complete-source.zip" HEAD || true
      - uses: actions/upload-artifact@v4
        with: {name: OptiCast-APK-v${{ inputs.version || '2.6.60' }}, path: releases/*}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: {files: releases/*, generate_release_notes: true}
        env: {GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}}
