name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./project/gradlew

      - name: Run unit tests
        working-directory: ./project
        run: ./gradlew :app:testDebugUnitTest --tests "com.opticast.player.util.*" --tests "com.opticast.player.data.local.*" --tests "com.opticast.player.data.parser.*" --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: project/app/build/reports/tests/
          
