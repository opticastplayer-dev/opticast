name: Unit Tests
on:
  push: branches [main]
  pull_request: branches [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - Checkout@v4
      - JDK 17 temurin cache gradle
      - Setup Android SDK: sdkmanager install platform-tools platforms;android-36 platforms;android-35 build-tools;35.0.0
      - Setup Gradle v3
      - chmod +x gradlew
      - Run ALL tests: ./gradlew :app:testDebugUnitTest --stacktrace (9 files, 25+ tests)
      - Upload reports + test-results
      - Summary cat XML
