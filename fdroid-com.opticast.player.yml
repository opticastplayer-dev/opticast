Description: |
  OptiCast — Your Local Cinema, Offline-First, Mobile Only — Stable 9.3/10

  Beautiful, fast local video player for Android. Your own movies and TV shows, organized beautifully, playing perfectly offline. Infuse-style polish for Android, 38M APK, 110 baseline locked.

  No ads, no tracking, completely free, open source GPL-3.0.

  LIBRARY: Finds your videos automatically, beautiful poster grid you can customize (Compact/Comfortable), fast-scroll thumb appears only when scrolling >20 items — Infuse-like overlay GPU 0 recomposition low-RAM safe, Continue Watching, Movies & TV Shows organized, Favorites, Recently Added, Collections, search, easy sharing, shared element transition Library→Detail poster hero spring 0.96f. Fast and smooth 60fps matches Settings.

  MOVIE INFO: Automatically recognizes movies and TV shows from filenames, fetches posters and information, saves for offline viewing, beautiful blurred poster fallback never shows black background, shimmer NEW only. Ratings, cast, genres, runtime, story, backdrop parallax.

  SUBTITLES: Finds and saves subtitles for offline viewing during scan and caches them, supports two languages at once, easy sync adjustment, all formats, custom fonts picker offline .ttf/.otf 10MB max private. Always saved offline.

  VIDEO PLAYER — PLAYS EVERYTHING: Powerful mpv engine (local default) + Media3 fallback plays all video formats (mkv, mp4, avi, etc.). Beautiful player: easy controls, speed control, aspect ratio, subtitle/audio picker. Gestures: double-tap to seek, swipe for volume/brightness, pinch to zoom, hold for fast forward, scrub preview. Sleep timer, auto-play next episode, chapters, notification controls, Picture-in-Picture that auto-resumes fixed for 32-bit, predictive back Android 14+ swipe preview. Loading spinner never gets stuck.

  UPDATES: Works offline-first: checks for updates only when internet is available (7 days, 24h min), uses minimal data. Easy updates inside app with progress bar via FileProvider, no browser needed. Clearly shows what's new in each update, What's New card only after update not every startup.

  WORKS OFFLINE: Works fully offline after saving posters and subtitles, uses minimal data. Subtitles always saved during scan, posters saved, movie info saved. Offline-first #1 priority.

  FAST & SMOOTH: Quick startup <300ms, smooth scrolling 60fps, lightweight 38M, reliable 9.3/10 stable, handles damaged files gracefully. Mobile only: designed for phones, easy to use, saves 18KB.

  PRIVATE: No ads, no tracking, open source GPL-3.0, your media stays on your device, no accounts needed.

