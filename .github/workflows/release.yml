name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 2.6.74-optimized)'
        required: true
        default: '2.6.74-optimized'
      full_mpv:
        description: 'Build full with mpv (true) or Media3-only (false)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore signing key
        run: |
          mkdir -p signing
          rm -f signing/opticast-release.jks signing/signing.properties
          if [ -n "${{ secrets.SIGNING_JKS_BASE64 }}" ]; then
            echo "Found secret"
            echo "${{ secrets.SIGNING_JKS_BASE64 }}" | tr -d ' \n\r\t' | base64 -d > signing/opticast-release.jks 2>&1 && echo "JKS decoded" || {
              echo "${{ secrets.SIGNING_JKS_BASE64 }}" | base64 -d -i > signing/opticast-release.jks 2>&1 && echo "Decoded with -i" || {
                echo "Invalid base64, fallback to debug"
                rm -f signing/opticast-release.jks
              }
            }
            echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" > signing/signing.properties
            echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> signing/signing.properties
            echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> signing/signing.properties
          else
            echo "storePassword=android" > signing/signing.properties
            echo "keyAlias=androiddebugkey" >> signing/signing.properties
            echo "keyPassword=android" >> signing/signing.properties
          fi
          ls -lh signing/ || true

      - name: Generate Gradle Wrapper if missing
        run: |
          cd project
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1 || true
          fi
          chmod +x gradlew || true

      - name: Restore native runtime AAR for full mpv (BULLETPROOF)
        if: ${{ inputs.full_mpv == 'true' || inputs.full_mpv == '' }}
        run: |
          echo "=== Checking for prebuilt AAR (permanent, never depends on releases) ==="
          ls -lh project/native/prebuilt/ || echo "No prebuilt dir"
          ls -lh .cache/native-runtime/ || echo "No cache dir"
          mkdir -p .cache/native-runtime
          mkdir -p project/native/prebuilt
          if [ -f "project/native/prebuilt/opticast-mpv-runtime.aar" ]; then
            echo "Prebuilt AAR exists, copying to cache"
            cp project/native/prebuilt/opticast-mpv-runtime.aar .cache/native-runtime/
            ls -lh .cache/native-runtime/
            if unzip -l .cache/native-runtime/opticast-mpv-runtime.aar | grep -q libmpv; then
              echo "Prebuilt AAR verified has libmpv"
            else
              echo "ERROR: Prebuilt AAR missing libmpv!"
              exit 1
            fi
          fi
          python3 project/native/restore-from-apk.py
          RESTORE_EXIT=$?
          if [ $RESTORE_EXIT -ne 0 ]; then
            echo "FATAL: Restore failed - refusing Media3-only build that breaks install-over"
            exit 1
          fi
          ls -lh .cache/native-runtime/ || true
          if [ -f ".cache/native-runtime/opticast-mpv-runtime.aar" ]; then
            if unzip -l .cache/native-runtime/opticast-mpv-runtime.aar | grep -q libmpv; then
              echo "AAR has libmpv - OK"
            else
              echo "FATAL: AAR missing libmpv"
              exit 1
            fi
          else
            echo "FATAL: AAR missing after restore"
            exit 1
          fi

      - name: Build APK
        run: |
          cd project
          if [ -f "../.cache/native-runtime/opticast-mpv-runtime.aar" ] || [ -f "native/prebuilt/opticast-mpv-runtime.aar" ]; then
            echo "Building FULL with mpv"
            if [ -f "native/prebuilt/opticast-mpv-runtime.aar" ] && [ ! -f "../.cache/native-runtime/opticast-mpv-runtime.aar" ]; then
              mkdir -p ../.cache/native-runtime
              cp native/prebuilt/opticast-mpv-runtime.aar ../.cache/native-runtime/
            fi
            ./gradlew assembleOfficialRelease --stacktrace --no-daemon || ./gradlew assembleRelease --stacktrace --no-daemon
          else
            echo "No AAR found"
            if [ "${{ inputs.full_mpv }}" == "true" ] || [ -z "${{ inputs.full_mpv }}" ]; then
              echo "FATAL: full_mpv=true but no AAR"
              exit 1
            fi
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi

      - name: Find APK
        run: |
          find project/app/build/outputs -name "*.apk" -type f -exec ls -lh {} \;

      - name: Verify APK is full mpv
        if: ${{ inputs.full_mpv == 'true' || inputs.full_mpv == '' }}
        run: |
          APK=$(find project/app/build/outputs/apk -name "*.apk" -type f | grep -E "official|release" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find project/app/build/outputs/apk -name "*.apk" -type f | head -1)
          fi
          echo "Verifying $APK"
          if [ ! -f "$APK" ]; then exit 1; fi
          SIZE=$(stat -c%s "$APK" || stat -f%z "$APK")
          echo "Size $SIZE"
          if [ "$SIZE" -lt 20000000 ]; then
            echo "FATAL: APK too small, Media3-only"
            exit 1
          fi
          if unzip -l "$APK" | grep -q "libmpv"; then
            echo "SUCCESS full mpv"
          else
            echo "FATAL missing libmpv"
            exit 1
          fi

      - name: Package
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.ref_name }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="2.6.74-optimized"
          fi
          VERSION=${VERSION#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION $VERSION"
          mkdir -p releases
          APK=$(find project/app/build/outputs/apk -name "*.apk" -type f | grep -E "official|release" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find project/app/build/outputs/apk -name "*.apk" -type f | head -1)
          fi
          echo "APK $APK"
          if [ -f "$APK" ]; then
            cp "$APK" "releases/OptiCast-v${VERSION}.apk"
            ls -lh "releases/OptiCast-v${VERSION}.apk"
            if unzip -l "$APK" | grep -q "libmpv"; then echo "FULL"; else echo "Media3"; fi
            sha256sum "releases/OptiCast-v${VERSION}.apk" > "releases/SHA256SUMS-v${VERSION}.txt"
          else
            echo "No APK"; exit 1
          fi
          git archive --format=zip -o "releases/OptiCast-v${VERSION}-complete-source.zip" HEAD || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptiCast-APK
          path: releases/*

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
