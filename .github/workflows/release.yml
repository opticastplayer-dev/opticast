name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 2.6.60)'
        required: true
        default: '2.6.60'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          sdkmanager --list_installed | tail -10 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore signing key
        run: |
          mkdir -p signing
          if [ -n "${{ secrets.SIGNING_JKS_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_JKS_BASE64 }}" | base64 -d > signing/opticast-release.jks
            echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" > signing/signing.properties
            echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> signing/signing.properties
            echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> signing/signing.properties
          else
            echo "storePassword=android" > signing/signing.properties
            echo "keyAlias=androiddebugkey" >> signing/signing.properties
            echo "keyPassword=android" >> signing/signing.properties
          fi
          ls -lh signing/ || true
          cat signing/signing.properties || true

      - name: Build APK
        run: |
          cd project
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          find project/app/build/outputs/apk -name "*.apk" -type f
          ls -lh project/app/build/outputs/apk/debug/ || true

      - name: Package
        run: |
          VERSION=${{ github.event.inputs.version || '2.6.60' }}
          VERSION=${VERSION#v}
          mkdir -p releases
          APK=$(find project/app/build/outputs/apk -name "*.apk" -type f | head -1)
          echo "APK=$APK"
          if [ -f "$APK" ]; then
            cp "$APK" "releases/OptiCast-v${VERSION}.apk"
            sha256sum "releases/OptiCast-v${VERSION}.apk" > "releases/SHA256SUMS-v${VERSION}.txt"
          else
            echo "No APK found"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptiCast-APK
          path: releases/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
